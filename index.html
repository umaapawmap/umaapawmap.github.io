<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>UMAAPAW Map</title>
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <link rel="stylesheet" href="assets/css/base.css" />
        <link rel="stylesheet" href="assets/css/layout.css" />
        <link rel="stylesheet" href="assets/css/components.css" />
        <link rel="stylesheet" href="assets/css/visualizer.css" />
    </head>
    <body>
        <div id="app">
            <!--Header-->
            <header class="main-header">
                <button id="menu-toggle">☰</button>
                <div class="logo">UMAAPAW Map</div>
            </header>

            <!--Sidebar-->
            <aside id="drawer" class="sidebar">
                <div class="search-bar">
                    <input type="text" placeholder="Search building" />
                </div>

                <nav>
                    <ul>
                        <!--<li><a href="#">Current Status</a></li>
                        <li><a href="#">Historical Data</a></li>
                        <li><a href="#">Emergency Contacts</a></li>
                        <li><a href="#">Report Flood</a></li>-->
                        <li><a href="#">View Typhoons</a></li>
                    </ul>
                </nav>

                <!--Attribution-->
                <div class="map-credits">
                    <p>
                        Map data &copy;
                        <a href="https://www.openstreetmap.org/copyright"
                            >OpenStreetMap</a
                        >
                        contributors
                    </p>
                    <p>
                        &copy;
                        <a href="https://carto.com/attributions">CARTO</a>
                    </p>
                    <hr />
                    <p>
                        Licensed under
                        <a href="LICENSE" target="_blank">GPL v3</a>
                    </p>
                </div>
            </aside>

            <!--Calendar Picker-->
            <div class="calendar-wrapper">
                <button id="calendar-btn">📅</button>
                <input type="date" id="calendar-input" style="display: none" />
            </div>

            <!--Timeline-->
            <div class="timeline-container">
                <div class="center-pointer"></div>
                <div class="timeline-track" id="timeline-track"></div>
            </div>
        </div>

        <!--Map-->
        <div id="map"></div>

        <!--Info panel-->
        <div id="info-panel" class="info-panel hidden">
            <h2 id="info-title"></h2>
            <p>Barangay Level Data</p>
            <div class="info-actions">
                <button id="visualize-flood-btn">Visualize Flood Height</button>
            </div>
        </div>

        <!--Flood Visualizer-->
        <div id="flood-visualizer" class="visualizer-window hidden">
            <div class="visualizer-frame">
                <div class="ruler-container">
                    <div class="ruler-line">3m</div>
                    <div class="ruler-line">2m</div>
                    <div class="ruler-line">1m</div>
                    <div class="ruler-line baseline">0m</div>
                    
                    <img src="assets/images/silhouette.png" id="person-silhouette" alt="Person">
                    <div id="water-fill" class="water-overlay"></div>
                </div>

                <div class="visualizer-controls">
                    <h3>Flood Height: <span id="height-val">0.0</span>m</h3>
                    <button id="exit-visualizer">Back to Map</button>
                </div>
            </div>
        </div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script type="module" src="scripts/main.js"></script>
        <script type="module" src="scripts/map.js"></script>
        <script type="module" src="scripts/ui.js"></script>
        <script type="module" src="scripts/api.js"></script>
        <script type="module" src="scripts/timeline.js"></script>
        <script type="module" src="scripts/calendar.js"></script>
        <script type="module" src="scripts/visualizer.js"></script>
    </body>
</html>
