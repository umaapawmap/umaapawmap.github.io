<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Dashboard - Olongapo Flood Map</title>
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <link rel="stylesheet" href="../assets/css/map.css" />
    </head>
    <body>
        <button id="togglePanelsBtn" class="toggle-btn" aria-pressed="false">
            ☰
        </button>
        <aside id="sidebar" class="sidebar">
            <div class="icon-row">
                <div class="icon">📍</div>
                <div class="icon">💬</div>
                <div class="icon">ℹ️</div>
            </div>
            <input
                class="search"
                placeholder="Search location"
                aria-label="Search location"
            />
            <div class="menu">
                <button type="button">Evacuation Zones</button>
                <button type="button">Hospitals</button>
                <button type="button">Under Construction</button>
            </div>
            <div class="spacer"></div>
        </aside>

        <div id="map"></div>

        <div id="calendarPanel" class="calendar-panel">
            <div class="calendar">
                <div class="calendar-header">
                    <button id="prevMonth" aria-label="Previous month">
                        ◀
                    </button>
                    <div id="monthYear"></div>
                    <button id="nextMonth" aria-label="Next month">▶</button>
                </div>
                <div class="calendar-grid">
                    <span>Sun</span><span>Mon</span><span>Tue</span
                    ><span>Wed</span><span>Thu</span><span>Fri</span
                    ><span>Sat</span>
                </div>
                <div id="calendarDays" class="calendar-days"></div>
            </div>
        </div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="../assets/js/map.js"></script>
    </body>
</html>
