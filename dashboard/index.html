<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Dashboard - Olongapo Flood Map</title>
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <link rel="stylesheet" href="../assets/css/map.css" />
    </head>
    <body>
        <button id="toggleDrawerBtn" class="toggle-btn" aria-pressed="false">
            ☰
        </button>

        <div id="drawer" class="drawer">
            <button id="drawerCloseBtn" class="drawer-close">✕</button>
            <div class="drawer-header">Menu</div>

            <div class="tab-bar">
                <button id="tabLeft" class="tab-arrow hidden">◀</button>
                <div id="tabLabel" class="tab-label">Layers</div>
                <button id="tabRight" class="tab-arrow">▶</button>
            </div>

            <div class="tab-content" id="tabContent">
                <div class="tab-pane active" data-tab="layers">
                    <input
                        class="search"
                        placeholder="Search location"
                        aria-label="Search location"
                    />
                </div>
                <div class="tab-pane" data-tab="info"></div>
                <div class="tab-pane" data-tab="calendar">
                    <div class="calendar">
                        <div class="calendar-header">
                            <button id="prevMonth" aria-label="Previous month">
                                ◀
                            </button>
                            <div id="monthYear"></div>
                            <button id="nextMonth" aria-label="Next month">
                                ▶
                            </button>
                        </div>
                        <div class="calendar-grid">
                            <span>Sun</span><span>Mon</span><span>Tue</span
                            ><span>Wed</span><span>Thu</span><span>Fri</span
                            ><span>Sat</span>
                        </div>
                        <div id="calendarDays" class="calendar-days"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="map"></div>

        <div class="slider-container">
            <img
                id="dayPointer"
                class="day-pointer"
                src="../assets/images/triangle-white.png"
                alt="pointer"
            />
            <div id="daySlider" class="day-slider"></div>
        </div>

        <div id="visualizer" class="visualizer-window">
            <img
                src="../assets/images/vis_bg.png"
                alt="Visualizer background"
            />
            <div id="waterOverlay"></div>
        </div>

        <div id="dimOverlay"></div>

        <div id="infoPanel" class="info-panel">
            <button id="infoPanelClose" class="info-panel-close">✕</button>
            <div class="info-panel-content">
                <h3 id="infoPanelTitle"></h3>
                <div id="infoPanelBody"></div>
            </div>
        </div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="../assets/js/map.js"></script>
    </body>
</html>
